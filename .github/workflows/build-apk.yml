name: Build CoupleGrow APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install frontend dependencies
        run: npm ci

      - name: Set app version metadata
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.${{ github.run_number }}
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${VERSION_CODE}/" android/app/build.gradle
          sed -i 's/versionName "[^"]*"/versionName "'"${VERSION_NAME}"'"/' android/app/build.gradle
          mkdir -p static
          cat > static/app-version.json <<EOF
          {
            "versionCode": ${VERSION_CODE},
            "versionName": "${VERSION_NAME}",
            "downloadUrl": "https://github.com/${{ github.repository }}/releases/download/v${VERSION_NAME}/couplegrow.apk"
          }
          EOF

      - name: Prepare Android signing
        run: |
          KEYSTORE_B64='${{ secrets.ANDROID_KEYSTORE_BASE64 }}'
          case "$KEYSTORE_B64" in
            ANDROID_KEYSTORE_BASE64=*) KEYSTORE_B64="${KEYSTORE_B64#ANDROID_KEYSTORE_BASE64=}" ;;
          esac
          KEYSTORE_B64="${KEYSTORE_B64#\"}"
          KEYSTORE_B64="${KEYSTORE_B64%\"}"
          printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]' | base64 --decode > android/app/couplegrow-release.keystore
          cat > android/app/keystore.properties <<EOF
          storeFile=couplegrow-release.keystore
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          EOF

      - name: Commit latest app version metadata
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/static/app-version.json
          git diff --cached --quiet || git commit -m "chore: update CoupleGrow app version [skip ci]"
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build signed release APK
        working-directory: frontend/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: couplegrow-apk-${{ github.run_number }}
          path: frontend/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Prepare release APK filename
        run: cp android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/apk/release/couplegrow.apk

      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: CoupleGrow v1.${{ github.run_number }}
          generate_release_notes: true
          files: frontend/android/app/build/outputs/apk/release/couplegrow.apk
